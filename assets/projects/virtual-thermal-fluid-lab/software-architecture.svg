<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc">
<title id="title">Virtual Thermal Fluid Lab software architecture</title><desc id="desc">A scenario runner drives a Python plant and separately advances C controller virtual time. Plant outputs pass through observed I/O adapters to the controller. Requested commands pass through leases and actuator faults, returning as held applied inputs. The runner records the experiment for an evaluator, verified export and static browser replay. Dashed source reuse connects the same core to cross-built Pico wrappers; no physical thermal rig is claimed.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#286787"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a44a28"/></marker></defs>
<rect width="1120" height="1100" fill="white"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="43" font-size="34" font-weight="700" fill="#203b46" text-anchor="start">Software architecture</text><text x="40" y="77" font-size="23" font-weight="400" fill="#203b46" text-anchor="start">One experiment · one C core · inspectable records</text><rect x="40" y="105" width="1040" height="140" rx="14" fill="#f5f8f7" stroke="#47616b" stroke-width="2"/>
<circle cx="71" cy="140" r="17" fill="#47616b"/>
<text x="71" y="147" font-size="21" font-weight="700" fill="white" text-anchor="middle">1</text>
<text x="99" y="148" font-size="26" font-weight="700" fill="#203b46" text-anchor="start">Scenario + virtual-time runner</text>
<text x="63" y="188" font-size="22" font-weight="400" fill="#203b46" text-anchor="start">Strict configuration · model, limits, solver settings and fault timeline</text>
<text x="63" y="219" font-size="22" font-weight="400" fill="#203b46" text-anchor="start">Integer-microsecond scheduling · split at events · hold inputs between updates</text><rect x="40" y="325" width="300" height="210" rx="14" fill="#f5f8f7" stroke="#47616b" stroke-width="2"/>
<circle cx="71" cy="360" r="17" fill="#47616b"/>
<text x="71" y="367" font-size="21" font-weight="700" fill="white" text-anchor="middle">2</text>
<text x="99" y="368" font-size="26" font-weight="700" fill="#203b46" text-anchor="start">Python plant</text>
<text x="63" y="408" font-size="22" font-weight="400" fill="#203b46" text-anchor="start">Temperatures + flow</text>
<text x="63" y="439" font-size="22" font-weight="400" fill="#203b46" text-anchor="start">Pump / valve dynamics</text>
<text x="63" y="470" font-size="22" font-weight="400" fill="#203b46" text-anchor="start">SciPy integration</text>
<text x="63" y="501" font-size="22" font-weight="400" fill="#203b46" text-anchor="start">Truth stays in the runner</text><rect x="410" y="325" width="300" height="210" rx="14" fill="#f5f8f7" stroke="#47616b" stroke-width="2"/>
<circle cx="441" cy="360" r="17" fill="#47616b"/>
<text x="441" y="367" font-size="21" font-weight="700" fill="white" text-anchor="middle">3</text>
<text x="469" y="368" font-size="26" font-weight="700" fill="#203b46" text-anchor="start">Observed I/O</text>
<text x="433" y="408" font-size="22" font-weight="400" fill="#203b46" text-anchor="start">Quantized sensor values</text>
<text x="433" y="439" font-size="22" font-weight="400" fill="#203b46" text-anchor="start">Timestamp + validity</text>
<text x="433" y="470" font-size="22" font-weight="400" fill="#203b46" text-anchor="start">Freeze / delay / damage</text>
<text x="433" y="501" font-size="22" font-weight="400" fill="#203b46" text-anchor="start">No fault labels sent</text><rect x="780" y="325" width="300" height="210" rx="14" fill="#f0f6fa" stroke="#286787" stroke-width="2"/>
<circle cx="811" cy="360" r="17" fill="#286787"/>
<text x="811" y="367" font-size="21" font-weight="700" fill="white" text-anchor="middle">4</text>
<text x="839" y="368" font-size="26" font-weight="700" fill="#203b46" text-anchor="start">C controller</text>
<text x="803" y="408" font-size="22" font-weight="400" fill="#203b46" text-anchor="start">Native host subprocess</text>
<text x="803" y="439" font-size="22" font-weight="400" fill="#203b46" text-anchor="start">Flow PI + latched trips</text>
<text x="803" y="470" font-size="22" font-weight="400" fill="#203b46" text-anchor="start">Bounded frames + CRC</text>
<text x="803" y="501" font-size="22" font-weight="400" fill="#203b46" text-anchor="start">Observed channels only</text><path d="M320 245V314" fill="none" stroke="#286787" stroke-width="3" marker-end="url(#blue)"/><text x="67" y="279" font-size="20" font-weight="400" fill="#203b46" text-anchor="start">Integrate / sample</text><path d="M1030 245V314" fill="none" stroke="#286787" stroke-width="3" marker-end="url(#blue)"/><text x="779" y="277" font-size="20" font-weight="700" fill="#286787" text-anchor="start">Reliable STEP clock</text><text x="797" y="301" font-size="19" font-weight="400" fill="#286787" text-anchor="start">even if sensors drop</text><path d="M340 430H398" fill="none" stroke="#286787" stroke-width="3" marker-end="url(#blue)"/><path d="M710 430H768" fill="none" stroke="#286787" stroke-width="3" marker-end="url(#blue)"/><rect x="480" y="610" width="600" height="135" rx="14" fill="#fff5ec" stroke="#a44a28" stroke-width="2"/>
<circle cx="511" cy="645" r="17" fill="#a44a28"/>
<text x="511" y="652" font-size="21" font-weight="700" fill="white" text-anchor="middle">5</text>
<text x="539" y="653" font-size="26" font-weight="700" fill="#203b46" text-anchor="start">Command lease + actuator path</text>
<text x="503" y="693" font-size="21" font-weight="400" fill="#203b46" text-anchor="start">Requested → accepted under lease → fault-modified input</text>
<text x="503" y="724" font-size="21" font-weight="400" fill="#203b46" text-anchor="start">Actual pump / valve response is computed by the plant</text><path d="M930 535V598" fill="none" stroke="#a44a28" stroke-width="3" marker-end="url(#orange)"/><text x="946" y="578" font-size="20" font-weight="400" fill="#a44a28" text-anchor="start">Request</text><path d="M480 678H190V548" fill="none" stroke="#a44a28" stroke-width="3" marker-end="url(#orange)"/><text x="203" y="648" font-size="21" font-weight="700" fill="#a44a28" text-anchor="start">Held applied inputs</text><text x="40" y="786" font-size="22" font-weight="400" fill="#203b46" text-anchor="start">The runner records truth, observations, commands and original wire bytes.</text><path d="M40 460H15V895H28" fill="none" stroke="#286787" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><rect x="40" y="815" width="470" height="160" rx="14" fill="#f5f8f7" stroke="#47616b" stroke-width="2"/>
<circle cx="71" cy="850" r="17" fill="#47616b"/>
<text x="71" y="857" font-size="21" font-weight="700" fill="white" text-anchor="middle">6</text>
<text x="99" y="858" font-size="26" font-weight="700" fill="#203b46" text-anchor="start">Evaluator + records</text>
<text x="63" y="898" font-size="21" font-weight="400" fill="#203b46" text-anchor="start">Expectation / containment / completion</text>
<text x="63" y="929" font-size="21" font-weight="400" fill="#203b46" text-anchor="start">CSV + wire + configuration manifests</text>
<text x="63" y="960" font-size="21" font-weight="400" fill="#203b46" text-anchor="start">Source, solver and file hashes</text><rect x="580" y="815" width="500" height="160" rx="14" fill="#f5f8f7" stroke="#47616b" stroke-width="2"/>
<circle cx="611" cy="850" r="17" fill="#47616b"/>
<text x="611" y="857" font-size="21" font-weight="700" fill="white" text-anchor="middle">7</text>
<text x="639" y="858" font-size="26" font-weight="700" fill="#203b46" text-anchor="start">Verified export → browser</text>
<text x="603" y="898" font-size="21" font-weight="400" fill="#203b46" text-anchor="start">All retained rows · original downloads</text>
<text x="603" y="929" font-size="21" font-weight="400" fill="#203b46" text-anchor="start">JavaScript + uPlot · shared cursor</text>
<text x="603" y="960" font-size="21" font-weight="400" fill="#203b46" text-anchor="start">Graphs, events and scenario comparison</text><path d="M510 900H568" fill="none" stroke="#286787" stroke-width="3" marker-end="url(#blue)"/><rect x="40" y="1010" width="1040" height="70" rx="12" fill="#f0f6fa" stroke="#286787" stroke-dasharray="7 5"/><text x="61" y="1040" font-size="24" font-weight="700" fill="#203b46" text-anchor="start">Same C source → Pico HAL: timer / ADC / GPIO / USB / watchdog</text><text x="61" y="1069" font-size="21" font-weight="400" fill="#203b46" text-anchor="start">Both target images cross-built · indicator-only GPIO · board execution not performed</text><path d="M1080 430H1100V1043H1087" fill="none" stroke="#286787" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/></g></svg>
